<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping List</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>
<body>

    <div class="container">
        <h1>🛒 My Shopping List</h1>
        <p class="subtitle">Keep track of your shopping expenses.</p>

        <!-- Product input form -->
        <div class="input-section">
            <input
                type="text"
                id="productName"
                placeholder="Enter product name"
            >

            <input
                type="number"
                id="productPrice"
                placeholder="Enter price (KSh)"
                min="0"
                step="0.01"
            >

            <button id="addButton">Add Product</button>
        </div>

        <!-- Shopping list -->
        <h2>Your Products</h2>
        <ul id="shoppingList"></ul>

        <!-- Total amount spent -->
        <div class="total-section">
            <h2>Total Spent</h2>
            <p>KSh <span id="totalSpent">0.00</span></p>
        </div>

        <button id="clearButton" class="clear-button">
            Clear All Products
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
